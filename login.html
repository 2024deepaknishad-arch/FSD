<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — CyberAudit 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0A0E14', surface: '#10151D', surface2: '#161C26',
          border: '#212938', text: '#E6EAF0', dim: '#8792A3',
          cyan: '#22D3EE', green: '#34D399', amber: '#FBBF24', red: '#FB7185',
        },
        fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
      },
    },
  };
</script>
<style>
  body { background-color: #0A0E14; }
  .grid-bg {
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  input:focus { outline: none; }
  .field:focus-within { border-color: #22D3EE; box-shadow: 0 0 0 3px rgba(34,211,238,0.12); }
</style>
</head>
<body class="font-sans text-text antialiased min-h-screen grid-bg">

  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">

    <a href="index.html" class="flex items-center gap-2 mb-8">
      <span class="w-2.5 h-2.5 rounded-full bg-cyan"></span>
      <span class="font-mono font-semibold tracking-tight">CYBERAUDIT<span class="text-cyan">360</span></span>
    </a>

    <div class="w-full max-w-sm bg-surface border border-border rounded-xl p-8 shadow-2xl">
      <h1 class="text-xl font-bold mb-1">Sign in to your console</h1>
      <p class="text-sm text-dim mb-8">Monitor activity across your organization.</p>

      <form class="space-y-5" action="dashboard.html" method="get">
        <div>
          <label for="email" class="block text-xs font-medium text-dim mb-1.5">Email</label>
          <div class="field flex items-center border border-border bg-surface2 rounded-md px-3 transition">
            <input id="email" type="email" placeholder="you@company.com"
                   class="w-full bg-transparent py-2.5 text-sm text-text placeholder:text-dim/60" />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-medium text-dim">Password</label>
            <a href="#" class="text-xs text-cyan hover:underline">Forgot password?</a>
          </div>
          <div class="field flex items-center border border-border bg-surface2 rounded-md px-3 transition">
            <input id="password" type="password" placeholder="••••••••"
                   class="w-full bg-transparent py-2.5 text-sm text-text placeholder:text-dim/60" />
          </div>
        </div>

        <label class="flex items-center gap-2 text-xs text-dim">
          <input type="checkbox" class="rounded border-border bg-surface2 accent-cyan" />
          Keep me signed in
        </label>

        <button type="submit"
                class="w-full bg-cyan text-bg font-semibold py-2.5 rounded-md hover:bg-cyan/90 transition">
          Log in
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-border text-center text-sm text-dim">
        Don't have an account?
        <a href="#" class="text-cyan hover:underline">Request access</a>
      </div>
    </div>

    <p class="mt-8 font-mono text-[11px] text-dim/70">Secured with JWT · bcrypt · role-based access control</p>
  </div>

</body>
</html>
