# Docker Compose Configuration for CyberAudit 360
# Experiment 9: Containerizing Full-Stack App with Docker Compose

services:
  backend:
    build: ./backend
    container_name: cyberaudit360-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cyberaudit360-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
